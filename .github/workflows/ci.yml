name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:playground
      - run: npm run check:package
      - name: Pack the tarball users will install
        if: matrix.node == 24
        run: npm pack
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24
        with:
          name: tarball
          path: smooth-stream-text-*.tgz

  runtime:
    name: Tarball on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The runtime promise is Node 18, older than what the tooling needs.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install the tarball into an empty project and run it
        run: |
          mkdir "$RUNNER_TEMP/consumer"
          cp scripts/smoke.mjs scripts/smoke.cjs "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/smooth-stream-text-*.tgz
          node smoke.mjs
          node smoke.cjs
