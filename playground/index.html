<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>smooth-stream-text - even out an LLM text stream</title>
    <meta
      name="description"
      content="Buffer bursty LLM output and release it at a visually even rate, then reveal it as a left-to-right wave. Zero dependencies, headless first." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="brand">
        <h1>smooth-stream-text</h1>
        <p>
          The same answer, streamed twice. On the left, chunks land as they arrive. On the right, they are paced and
          revealed as a wave.
        </p>
      </div>
      <nav class="links">
        <a
          class="icon-link"
          href="https://github.com/crmapache/smooth-stream-text"
          title="Source on GitHub"
          aria-label="Source on GitHub"
          rel="noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12" />
          </svg>
        </a>
        <a
          class="icon-link"
          href="https://www.npmjs.com/package/smooth-stream-text"
          title="Package on npm"
          aria-label="Package on npm"
          rel="noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M1.763 0C.786 0 0 .786 0 1.763v20.474C0 23.214.786 24 1.763 24h20.474c.977 0 1.763-.786 1.763-1.763V1.763C24 .786 23.214 0 22.237 0zM5.13 5.323l13.837.019-.009 13.836h-3.464l.01-10.382h-3.456L12.04 19.17H5.113z" />
          </svg>
        </a>
        <a
          class="icon-link"
          href="https://www.linkedin.com/in/spacenear-cr/"
          title="Author on LinkedIn"
          aria-label="Author on LinkedIn"
          rel="noreferrer">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path
              d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
          </svg>
        </a>
      </nav>
    </header>

    <main>
      <div class="stage">
        <section class="pane">
          <header class="pane-head">
            <h2>Raw stream</h2>
            <span class="tag">as received</span>
          </header>
          <div class="out" id="raw"></div>
        </section>

        <section class="pane pane-primary">
          <header class="pane-head">
            <h2>Smoothed</h2>
            <span class="tag tag-accent">smooth-stream-text</span>
          </header>
          <div class="out" id="smooth"></div>
        </section>
      </div>

      <aside class="panel">
        <div class="actions">
          <button id="start" type="button" class="primary">Play</button>
          <button id="restart" type="button">Restart</button>
          <button id="flush" type="button">Show all</button>
        </div>

        <div class="meters">
          <div class="meter">
            <span class="meter-label"><i class="dot dot-lag"></i>Backlog</span>
            <span class="meter-value" id="lag">0 ch</span>
          </div>
          <div class="meter">
            <span class="meter-label"><i class="dot dot-rate"></i>Rate</span>
            <span class="meter-value" id="rate">0 ch/s</span>
          </div>
          <div class="meter">
            <span class="meter-label">State</span>
            <span class="meter-value" id="status">idle</span>
          </div>
        </div>

        <canvas id="chart" aria-label="Backlog and draw rate over the last few seconds"></canvas>

        <div id="panel" class="groups"></div>
      </aside>
    </main>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
